# 生产环境 docker compose
# 使用方式：docker compose -f docker-compose.prod.yml up -d --build
#
# 数据目录（宿主机，重要！不要删除）：
#   MySQL 数据：/data/luotu/mysql
#   上传文件：  /data/luotu/uploads
#   导出文件：  /data/luotu/exports

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-luotu123}
      MYSQL_USER: luotu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-luotu123}
      MYSQL_DATABASE: luotu
    volumes:
      - /data/luotu/mysql:/var/lib/mysql
      - ./sql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uluotu", "-p${MYSQL_PASSWORD:-luotu123}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        IMAGE_PREFIX: ${IMAGE_PREFIX:-}
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://luotu:${MYSQL_PASSWORD:-luotu123}@mysql:3306/luotu
      ANALYTICS_DATABASE_URL: mysql+pymysql://luotu:${MYSQL_PASSWORD:-luotu123}@mysql:3306/luotu_analytics
      UPLOAD_DIR: /app/uploads
      EXPORT_DIR: /app/exports
    volumes:
      - /data/luotu/uploads:/app/uploads
      - /data/luotu/exports:/app/exports
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        IMAGE_PREFIX: ${IMAGE_PREFIX:-}
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
